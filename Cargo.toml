[package]
name = "lazy-ports"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Manage local dev services and ports from the COSMIC panel"
repository = "https://github.com/hayron/lazy-ports"

[build-dependencies]
xdgen = "0.1"

[dependencies]
i18n-embed-fl = "0.10"
open = "5.3.2"
rust-embed = "8.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.0", features = ["full"] }

[dependencies.i18n-embed]
version = "0.16"
features = ["fluent-system", "desktop-requester"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "87ab8179e1bd9880239c340855ae8862034bd0e8"
features = [
    "applet",
    "applet-token",
    "dbus-config",
    "tokio",
    "wayland",
    "winit",
]
